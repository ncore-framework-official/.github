name: Bug report
description: Report a reproducible problem in a public NCore product/package
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a public NCore issue. Do not include secrets, private repository content or exploitable security details.
  - type: input
    id: product
    attributes:
      label: Product / package
      placeholder: NCore Control
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Public version
      placeholder: 1.0.0
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe what happens.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Provide minimal reproducible steps.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Windows/NANOS version and other relevant public environment information.
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      description: Include only necessary logs after removing private data, tokens, endpoints and player information.
  - type: checkboxes
    id: confirmation
    attributes:
      label: Public-safe confirmation
      options:
        - label: I removed secrets, private NCore information and sensitive player/infrastructure data.
          required: true
        - label: This is not an exploitable security report.
          required: true
