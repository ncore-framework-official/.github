name: Finalize NCore Loading Screen artwork

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/finalize-loading-artwork.yml"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild approved artwork
        shell: bash
        run: |
          set -euo pipefail
          cat .github/tmp-loading/chunk01.b64               .github/tmp-loading/chunk02.b64               .github/tmp-loading/chunk03.b64               .github/tmp-loading/chunk04.b64               .github/tmp-loading/chunk05.b64               .github/tmp-loading/chunk06.b64             | base64 -d > profile/assets/branding/ncore-loading-screen-official.webp

          echo "28df01df43f4da088d29d1da3212d4cee93ddd70bb4dfe828b5a076a8461bbb9  profile/assets/branding/ncore-loading-screen-official.webp" | sha256sum -c -

      - name: Commit exact artwork and remove temporary upload files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          rm -rf .github/tmp-loading
          rm -f .github/workflows/finalize-loading-artwork.yml

          git add profile/assets/branding/ncore-loading-screen-official.webp
          git add -A .github

          git commit -m "fix(public): publish verified Loading Screen artwork"
          git push
